meta:
  name: "The Long Ebb"
  start_location: the_drift
  tone: |
    Quiet dread on a cold coast. Nothing leaps out. The horror is that everyone
    here is kind, and careful, and has agreed on something they will not say in
    front of you. Understatement carries the weight: the wrong detail noticed
    twice is worse than anything described.
  opening_scene: |
    The ferry puts you ashore an hour before the weather closes.

    Ordell is a village on a shingle spit, four streets wide, the sea on both
    sides of it. Nets on frames. Boats up above the tideline, all of them,
    though the light is good and the tide is right for going out.

    People come out to watch you land. Not many. They do not wave, and they do
    not go back inside either. A woman with salt-white hair is mending a net on
    the steps of the loft, and she smiles at you like someone who has been told
    company is coming.

    Your papers are in your coat: an appointment to record the village's
    objection to the harbour works. Behind you, the ferryman is already tying
    off. He does not seem to be planning to leave.

    What do you do?

history:
  - "Nineteen years ago the Ordell fleet went out on a flat calm and nine boats
     did not come back. There was no storm that night. The Commission's inquiry
     recorded the cause as 'undetermined' and was not invited to return."
  - "Ordell has not lost a boat since. Not one, in nineteen years, on a coast
     that takes two or three a winter from every other village along it."
  - "The Coastal Assay Commission wants the spit for a deep-water harbour. The
     village has objected to every survey, in writing, politely, without ever
     giving a reason a clerk could write down."
  - "There is a custom in Ordell that a thing named aloud is a thing invited in.
     Outsiders find it quaint. Nobody in Ordell finds it quaint."
  - "The parish register lists every birth on the spit for two hundred years.
     Nine entries from nineteen years ago have been scraped out with a knife,
     and one has been added in a different hand."

factions:
  drift_council:
    name: "The Drift Council"
    creed: "What keeps is kept. What is kept is not discussed."
    wants: "Ordell exactly as it is: the boats safe, the arrangement intact, and
      the Commission gone before anyone has to explain anything."
    known_for: "Immaculate manners, unhurried obstruction, and a way of
      answering a question with a true sentence about something else."
  coastal_assay:
    name: "The Coastal Assay Commission"
    creed: "A coast is a set of measurements. Measure it and it yields."
    wants: "The spit surveyed, the objection recorded and overruled, and the
      harbour begun before the spring estimates are published."
    known_for: "Charts, seals, and an absolute confidence that whatever is wrong
      here is a matter of drainage."

locations:
  the_drift:
    name: "The Drift"
    description: "The shingle landing at the neck of the spit, stones the size
      of fists that shift and talk under your boots. Every boat in Ordell is
      hauled up above the tideline and covered, tarred canvas lashed down tight,
      though the sea today is nothing at all."
    exits: [net_lofts, the_shallows]
    npcs: [sarn]
    items: [passage_papers, salt_lantern]
    secrets:
      - "The boats have been up for nineteen years. The tar is fresh. Someone
         re-covers them every season for a fleet that never launches."
      - "The shingle is dry above the tideline and dry below it. The tide comes
         in over these stones and leaves them dry."
      - "The ferryman who brought the player in has tried to cast off twice
         since they landed, both times with the tide in his favour, and both
         times found himself tying on again. He has not mentioned it."

  net_lofts:
    name: "The Net Lofts"
    description: "Long open sheds on stilts, hung with nets in every state of
      repair. It smells of tar, hemp and cold fish. Work goes on here all day
      and the nets never go into the water."
    exits: [the_drift, ordell_hall]
    npcs: [nell]
    items: [netting_needle, wet_shawl]
    secrets:
      - "Nell's netting is beautiful and none of it is finished. Every net in
         the loft is the same net, unpicked and remade, nineteen years of it."
      - "The other menders work with their backs to her. Not unkindly. They
         simply never sit facing her, and none of them has noticed doing it."

  ordell_hall:
    name: "The Long Hall"
    description: "One room, three hearths, benches worn to a shine. The village
      eats here when the weather is bad, which it will be by evening. A tally
      board hangs by the door where a shipping notice ought to be."
    exits: [net_lofts, assay_hut, the_shallows]
    npcs: [mother_gullick]
    items: [tally_board]
    secrets:
      - "The tally board records nights, not catches. Nineteen years of marks,
         and a handful each winter circled in chalk that nobody rubs out."
      - "There are places set at the long table that are cleared, washed and
         set again without anyone eating from them."

  the_shallows:
    name: "The Shallows"
    description: "Where the spit runs out into flats that go half a mile at low
      water. Ribs of old boats stand up out of the sand at intervals, dark and
      regular, like a fence that used to be something else."
    exits: [the_drift, ordell_hall, parish_chapel]
    npcs: []
    items: [bone_comb]
    secrets:
      - "Nine sets of ribs. They are not wrecks — the timbers are cut, not
         broken, and they were set into the sand deliberately, prow-first."
      - "Nothing lives in these flats. No worm casts, no cockles, no birds
         working the tideline. Half a mile of clean, empty, obedient sand."

  parish_chapel:
    name: "The Parish Chapel"
    description: "Squat, salt-scoured, older than the village that uses it. A
      lamp is kept lit in the vestry window facing the water, and has been kept
      lit long enough that the sill beneath it is burned black."
    exits: [the_shallows]
    npcs: [reverend_calder]
    items: [parish_register]
    secrets:
      - "The lamp is not a memorial and is not for guiding boats in. It faces
         the flats, and it is lit at dusk on the nights the board is circled."
      - "The chapel has no burials from nineteen years ago. Nine families, no
         graves, and nobody has ever asked Calder about it to his face."

  assay_hut:
    name: "The Assay Hut"
    description: "New timber, a stove, a folding table under a good lamp, and
      charts pinned flat with brass weights. The tidiest room on the spit, and
      the coldest, because nobody in Ordell will bring them fuel."
    exits: [ordell_hall]
    npcs: [assayer_pike, hesper]
    items: [assay_charts, survey_seal]
    secrets:
      - "Pike's soundings of the flats disagree with each other by a fathom and
         a half, taken a day apart from the same marks. He has re-taken them
         four times and written none of it down."
      - "Hesper has been keeping a second notebook and has not told Pike."

npcs:
  nell:
    name: "Nell Ashe"
    role: "Net-mender. Born on the spit, she will tell you, and has never left it."
    faction: drift_council
    default_disposition: 25
    wants: "Company, and to be asked ordinary questions. Nobody has asked her an
      ordinary question in a long time and she is starved for it without knowing
      that is what the hunger is."
    knows:
      - "Every family on the spit, their boats, their children, their debts."
      - "How to mend anything made of rope, in exhaustive and happy detail."
      - "That the village is kind to her and that this is not quite the same as
         being liked, though she cannot say where the difference sits."
    hides:
      - "Nothing at all, deliberately. She is the only person here with nothing
         to hide, which is what makes her frightening to talk to."
      - "She cannot account for the nights the board is circled, and has stopped
         reaching for those mornings because reaching makes her feel unwell."
      - "Her hair is wet at the roots on those mornings. She assumes it is the
         weather. It has been the weather for nineteen years."

  mother_gullick:
    name: "Mother Gullick"
    role: "Eldest of the Drift Council. Keeps the tally board and the peace."
    faction: drift_council
    default_disposition: -5
    wants: "You off the spit with your objection recorded and nothing else in
      your notebook. She will be hospitable about it for as long as it works."
    knows:
      - "What the arrangement is, what it costs, and precisely who agreed to it."
      - "That the custom against naming things is not superstition and that
         letting outsiders think it is has been very convenient."
      - "That Sarn is going to do something stupid, and roughly when."
    hides:
      - "That she was one of the nine who decided, and the only one still above
         ground to have decided it."
      - "That she has never once been able to look at the circled nights on her
         own board."
      - "That she does not believe it is working any more."

  sarn:
    name: "Sarn Vellacott"
    role: "Young fisherman. Tars boats that will not be launched."
    faction: drift_council
    default_disposition: 10
    wants: "To take a boat out. Just once, just him, and prove the sea is only
      the sea — and, underneath that, to make somebody finally say it out loud."
    knows:
      - "The tides and the channel better than anyone under sixty."
      - "That the village will not stop him going out, which frightens him far
         more than being forbidden would."
      - "That his father was one of the nine, and that his mother will not keep
         his father's name in the house."
    hides:
      - "That he has already taken a boat out once, at night, and came back, and
         will not say what turned him back."
      - "That he is in love with Nell and has understood for about a year why
         that is not a thing he can act on."

  reverend_calder:
    name: "Reverend Calder"
    role: "Keeps the chapel, the register, and the lamp in the vestry window."
    faction: drift_council
    default_disposition: 0
    wants: "To be forgiven by somebody qualified to do it, and to be asked
      directly, because he has decided he will not lie if he is asked directly."
    knows:
      - "Which nine entries were scraped from the register, and by whose hand."
      - "What the added entry says, and the date on it."
      - "That the lamp is lit at dusk on circled nights, because he lights it."
    hides:
      - "That the added entry is in his own handwriting."
      - "That he has drafted a confession eleven times and burned it eleven times."
      - "That he does not think what Ordell did was wrong. That is the part he
         cannot forgive himself for."

  assayer_pike:
    name: "Assayer Pike"
    role: "Commission surveyor, four weeks on the spit, forty years on coasts."
    faction: coastal_assay
    default_disposition: 5
    wants: "A clean survey and a posting somewhere with a railway station. He is
      not a fool and he is not a villain; he is a competent man whose competence
      has stopped working here."
    knows:
      - "That the village's written objections are, technically, all true."
      - "That Ordell has not lost a boat in nineteen years, which he has checked
         three times against the Commission's own loss registers."
      - "That his soundings of the flats will not agree with one another."
    hides:
      - "That he has stopped taking soundings at dusk and told himself it is
         about the light."
      - "That he has already written to request reassignment, and has not sent it."

  hesper:
    name: "Hesper Quill"
    role: "Commission clerk. Twenty-three, first posting, writes everything down."
    faction: coastal_assay
    default_disposition: 15
    wants: "To be taken seriously, and to be told she is not imagining it."
    knows:
      - "The Commission's procedure, exhaustively, and that Pike is departing
         from it."
      - "That she has counted the places set at the long table twice and got
         different numbers."
      - "That Nell Ashe does not appear in the parish register, and that Hesper
         checked it for an entirely innocent reason."
      - "That the Commission's ledgers record three men ferried out to this spit
         and three returned, and that the ferryman counts only two."
    hides:
      - "Nothing she would not tell you if you were kind to her for five minutes.
         She is the fastest route to the truth on this spit and everyone except
         Mother Gullick has failed to notice she exists."

items:
  passage_papers:
    name: "your appointment papers"
    description: "Commission letterhead, your name, a seal, and one paragraph of
      instruction. Damp at the corners already."
    notes: "They appoint the bearer to record Ordell's objection to the harbour
      works — not to rule on it. Nobody in Ordell has read them and every one of
      them assumes they say something worse."
  salt_lantern:
    name: "a lantern from the boat"
    description: "Tam's spare. Brass gone green, glass clouded, but it lights and
      it holds a flame in wind."
    notes: "The only light on the spit that nobody else decides when to light."
  netting_needle:
    name: "Nell's netting needle"
    description: "Whalebone, worn to a warm shine, wrapped at the grip with thread
      that has been renewed many times."
    notes: "It is nineteen years old at most, and worn like a tool used for sixty.
      Nell will hand it to you without hesitating if you ask about her work."
  wet_shawl:
    name: "a grey shawl"
    description: "Folded on a bench in the lofts, good wool, well kept."
    notes: "It is damp. It is always damp. It has never been in the water and it
      is damp at the shoulders, where hair would lie."
  tally_board:
    name: "the tally board"
    description: "A plank of oak by the hall door, ruled into columns and scored
      with nineteen years of marks in different hands."
    notes: "The columns are dates, not catches. Roughly four nights each winter
      are circled in chalk. The circles are never rubbed out and never explained."
  bone_comb:
    name: "a comb"
    description: "Bone, fine-toothed, half-buried in the sand of the flats.
      Unweathered. It could have been dropped this morning."
    notes: "Nell's, and it is one of nine identical combs that have turned up on
      these flats over the years. She will not recognise it."
  parish_register:
    name: "the parish register"
    description: "Two hundred years of births on the spit, in a dozen hands, kept
      dry and kept well."
    notes: "Nine entries from nineteen years ago have been scraped out. One entry
      has been added below them, dated the same night, in Calder's hand:
      'Ashe, Nell. Of this parish.'"
  assay_charts:
    name: "Pike's charts"
    description: "The flats, sounded and re-sounded, pinned flat under brass."
    notes: "Four surveys of the same ground, a day apart, disagreeing by a fathom
      and a half. Pike has annotated none of them. The fourth is unfinished."
  survey_seal:
    name: "the Commission seal"
    description: "Brass, heavy, the Assay's anchor-and-rule. It makes a document
      true as far as anyone off this spit is concerned."
    notes: "With it, an objection can be recorded — or withdrawn — and neither
      Ordell nor the Commission would be able to say otherwise."

quests:
  the_arrangement:
    name: "The Arrangement"
    summary: "Ordell has not lost a boat in nineteen years, on a coast that takes
      two or three a winter. Something is being paid, and the village has agreed
      never to say so aloud."
    stages:
      unaware: "The player has noticed nothing beyond a village that is unfriendly
        to surveyors."
      uneasy: "The player has seen at least one thing that does not add up — the
        tarred boats, the circled nights, the dry shingle."
      shown: "Someone has told the player what Ordell does, or as near as the
        custom lets them come."
      recorded: "The player has set it down under the Commission seal."
      buried: "The player has agreed to leave it out of the record."
    start: unaware

  what_nell_is:
    name: "What Nell Ashe Is"
    summary: "Nell was written into the parish register nineteen years ago, in
      Calder's hand, on the night nine other entries were scraped out."
    stages:
      unaware: "Nell is a net-mender who is kind to strangers."
      suspicious: "The player has noticed one impossibility about her."
      certain: "The player has proof — the register, the combs, or the shawl."
      told_her: "The player has told Nell what she is."
      kept_silent: "The player has learned what she is and let her go on mending."
    start: unaware
